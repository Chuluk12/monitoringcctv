services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "7082:8554"   # RTSP (only needed if you want to pull streams from outside Docker)
      - "7083:8888"   # HLS
      - "7084:8889"   # WebRTC (WHEP)
      - "7085:9997"   # HTTP control API
      - "7086:8189/udp" # WebRTC ICE/UDP
    networks:
      - cctv_network

  backend:
    build: ./backend
    env_file: .env
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      CRED_ENC_KEY: ${CRED_ENC_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
      HEALTH_CHECK_INTERVAL_SECONDS: ${HEALTH_CHECK_INTERVAL_SECONDS}
      MEDIAMTX_API: http://mediamtx:9997
    depends_on:
      mediamtx: { condition: service_started }
    ports: ["7081:4000"]
    networks:
      - cctv_network
      - postgres_database

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WEBRTC_BASE: ${NEXT_PUBLIC_WEBRTC_BASE}
    depends_on: [backend]
    ports: ["7080:3000"]
    networks:
      - cctv_network

networks:
  cctv_network:
    driver: bridge
  postgres_database:
    external: true
