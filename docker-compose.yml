services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    # Not exposed to the host - only reachable from other containers on this network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mediamtx:
    image: bluenviron/mediamtx:latest
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"   # RTSP (only needed if you want to pull streams from outside Docker)
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC (WHEP)
      - "9997:9997"   # HTTP control API
      - "8189:8189/udp" # WebRTC ICE/UDP

  backend:
    build: ./backend
    env_file: .env
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      CRED_ENC_KEY: ${CRED_ENC_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
      HEALTH_CHECK_INTERVAL_SECONDS: ${HEALTH_CHECK_INTERVAL_SECONDS}
      MEDIAMTX_API: http://mediamtx:9997
    depends_on:
      db: { condition: service_healthy }
      mediamtx: { condition: service_started }
    ports: ["4000:4000"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WEBRTC_BASE: ${NEXT_PUBLIC_WEBRTC_BASE}
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  postgres_data:
